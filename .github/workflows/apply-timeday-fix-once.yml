name: Apply timeDay consistency patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-timeday-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify expected Diary base
        run: |
          ACTUAL=$(git hash-object diary.html)
          EXPECTED=ba1cca0e20b45ab0e2a3cf6cfc63d6b86b64aba7
          echo "diary.html blob: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Apply timeDay consistency patch
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Validate JavaScript and patch
        run: |
          node --check /tmp/diary-inline.js
          git diff --check
          git diff -- diary.html
      - name: Commit Diary update
        run: |
          git config user.name "ChatGPT Diary Updater"
          git config user.email "actions@users.noreply.github.com"
          git add diary.html
          git commit -m "Fix Diary timeDay consistency"
          git push origin HEAD:main
