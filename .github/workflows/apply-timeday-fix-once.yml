name: Apply timeDay consistency patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-timeday-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify expected Diary base
        run: |
          ACTUAL=$(git hash-object diary.html)
          EXPECTED=ba1cca0e20b45ab0e2a3cf6cfc63d6b86b64aba7
          echo "diary.html blob: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Apply timeDay consistency patch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('diary.html')
          text = path.read_text(encoding='utf-8')

          patches = [
              (
                  """    const dueIn = panel.querySelector('.ap-due');
    if(dueIn) dueIn.addEventListener('change', e => {
      t.due = e.target.value || ''; ctx.save(); ctx.rerender();   /* 캘린더는 버튼을 눌러야 */
    });
    const dclr = panel.querySelector('.ap-dclr');
    if(dclr) dclr.onclick = () => { t.due = ''; ctx.save(); ctx.rerender(); };
""",
                  """    const dueIn = panel.querySelector('.ap-due');
    if(dueIn) dueIn.addEventListener('change', e => {
      t.due = e.target.value || '';
      /* 날짜별 일지 업무: 시간이 이미 있으면 timeDay도 새 실행 날짜를 따라간다.
         보관함/개인용무함은 기존의 '오늘 잡은 시간' 규칙을 유지한다. */
      if(!ctx.inbox && t.time) t.timeDay = t.due || curDate;
      ctx.save(); ctx.rerender();   /* 캘린더는 버튼을 눌러야 */
    });
    const dclr = panel.querySelector('.ap-dclr');
    if(dclr) dclr.onclick = () => {
      t.due = '';
      if(!ctx.inbox && t.time) t.timeDay = curDate;
      ctx.save(); ctx.rerender();
    };
"""
              ),
              (
                  """    panel.querySelector('.ap-time').addEventListener('change', e => {
      if(ctx.inbox) t.timeDay = e.target.value ? todayStr() : '';   /* 보관함 — 어느 날 잡은 시간인지 */
      t.time = e.target.value; ctx.save(); ctx.rerender();
""",
                  """    panel.querySelector('.ap-time').addEventListener('change', e => {
      const nextTime = e.target.value || '';
      t.time = nextTime;
      if(ctx.inbox) t.timeDay = nextTime ? todayStr() : '';       /* 보관함 — 기존 규칙 유지 */
      else t.timeDay = nextTime ? (t.due || curDate) : '';        /* 날짜별 일지 — 실행 날짜와 함께 저장 */
      ctx.save(); ctx.rerender();
"""
              ),
              (
                  """      t.time='';
      if(ctx.inbox) t.timeDay = '';
      ctx.save(); ctx.rerender();
""",
                  """      t.time='';
      t.timeDay='';
      ctx.save(); ctx.rerender();
"""
              ),
              (
                  """      if(t.gcalId && t.gcalId === evEditing.id){
        t.time = v; t.dur = mins;
""",
                  """      if(t.gcalId && t.gcalId === evEditing.id){
        t.time = v;
        t.timeDay = t.due || curDate;
        t.dur = mins;
"""
              ),
              (
                  """      if(t.gcalId && t.gcalId === deleting.id){
        t.gcalId = ''; t.gcalCalendar = ''; t.gcalSig = ''; t.time = ''; linked = true;
""",
                  """      if(t.gcalId && t.gcalId === deleting.id){
        t.gcalId = ''; t.gcalCalendar = ''; t.gcalSig = ''; t.time = ''; t.timeDay = ''; linked = true;
"""
              ),
          ]

          for i, (old, new) in enumerate(patches, 1):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'patch {i}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          scripts = []
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>', text, re.S | re.I):
              if re.search(r'\bsrc\s*=', m.group(1), re.I):
                  continue
              if m.group(2).strip():
                  scripts.append(m.group(2))
          Path('/tmp/diary-inline.js').write_text('\n;\n'.join(scripts), encoding='utf-8')

      - name: Validate JavaScript and patch
        run: |
          node --check /tmp/diary-inline.js
          git diff --check
          git diff -- diary.html

      - name: Commit Diary update
        run: |
          git config user.name "ChatGPT Diary Updater"
          git config user.email "actions@users.noreply.github.com"
          git add diary.html
          git commit -m "Fix Diary timeDay consistency"
          git push origin HEAD:main
