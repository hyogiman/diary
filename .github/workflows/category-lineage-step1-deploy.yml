name: Category lineage Step 1 deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/category-lineage-step1-deploy.yml'

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4

      - name: Verify source and apply narrow patch
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_BLOB='cb484bbeb29d8da3d9679424a53e2caa01974a49'
          ACTUAL_BLOB="$(git hash-object diary.html)"
          echo "Expected diary.html blob: $EXPECTED_BLOB"
          echo "Actual   diary.html blob: $ACTUAL_BLOB"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"

          python3 - <<'PY'
          from pathlib import Path

          p = Path('diary.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
              (
                  "normalize category origin",
                  "      id: c.id||uid8(), name: c.name||'', color: c.color||0, priv: !!c.priv,",
                  "      id: c.id||uid8(), origin: c.origin||'', name: c.name||'', color: c.color||0, priv: !!c.priv,",
              ),
              (
                  "FAB new category origin",
                  "  day.cats.push({id:cid, name:'', color: day.cats.length%PALETTE.length, note:'', files:[], tasks:[newTask()]});",
                  "  day.cats.push({id:cid, origin:cid, name:'', color: day.cats.length%PALETTE.length, note:'', files:[], tasks:[newTask()]});",
              ),
              (
                  "carry category lineage",
                  """    const prevCatNote = (pc.note||'').trim();
    let target = day.cats.find(c => c.name.trim() && c.name.trim() === pc.name.trim());
    if(!target){
      target = {id:uid8(), name:pc.name, color:pc.color||0, note:pc.note||'', files:[], tasks:[]};
      day.cats.push(target);
      if(prevCatNote) stats.carriedNotes++;
    }else if(prevCatNote && !(target.note||'').trim()){
      /* 오늘 이미 쓴 메모는 덮어쓰지 않고, 비어 있을 때만 이전 카테고리 메모를 이어받는다. */
      target.note = pc.note||'';
      stats.carriedNotes++;
    }""",
                  """    const prevCatNote = (pc.note||'').trim();
    const prevOrigin = (pc.origin||'').trim();

    /* 카테고리도 업무처럼 이름과 정체성을 분리한다.
       1) lineage(origin)가 있으면 origin으로 먼저 찾는다.
       2) legacy 자료처럼 한쪽 origin이 없을 때만 이름을 fallback으로 쓴다.
       3) 양쪽 origin이 서로 다르면 이름이 같아도 합치지 않는다. */
    let target = prevOrigin
      ? day.cats.find(c => (c.origin||'').trim() === prevOrigin)
      : null;

    if(!target){
      const byName = day.cats.find(c => c.name.trim() && c.name.trim() === pc.name.trim());
      if(byName && (!prevOrigin || !(byName.origin||'').trim())) target = byName;
    }

    if(!target){
      const cid = uid8();
      target = {
        id:cid,
        origin:prevOrigin || pc.id || cid,
        name:pc.name, color:pc.color||0, note:pc.note||'', files:[], tasks:[]
      };
      day.cats.push(target);
      if(prevCatNote) stats.carriedNotes++;
    }else{
      /* 이름 fallback으로 legacy 카테고리가 연결된 순간부터 lineage를 확정한다.
         오늘 카테고리에 이미 origin이 있다면 그 정체성을 존중한다. */
      if(!(target.origin||'').trim())
        target.origin = prevOrigin || pc.id || target.id || uid8();

      if(prevCatNote && !(target.note||'').trim()){
        /* 오늘 이미 쓴 메모는 덮어쓰지 않고, 비어 있을 때만 이전 카테고리 메모를 이어받는다. */
        target.note = pc.note||'';
        stats.carriedNotes++;
      }
    }""",
              ),
              (
                  "move-to-new category origin",
                  """      cat = {id:uid8(), name:(name||'').trim(), color: day.cats.length%PALETTE.length, note:'', files:[], tasks:[]};
      day.cats.push(cat);""",
                  """      const cid = uid8();
      cat = {id:cid, origin:cid, name:(name||'').trim(), color: day.cats.length%PALETTE.length, note:'', files:[], tasks:[]};
      day.cats.push(cat);""",
              ),
          ]

          for name, old, new in replacements:
              old_count = s.count(old)
              new_count = s.count(new)
              if old_count != 1 or new_count != 0:
                  raise SystemExit(f"ABORT {name}: old={old_count}, new={new_count}")
              s = s.replace(old, new, 1)
              print(f"APPLIED: {name}")

          assertions = [
              "id: c.id||uid8(), origin: c.origin||'', name: c.name||''",
              "day.cats.push({id:cid, origin:cid, name:''",
              "const prevOrigin = (pc.origin||'').trim();",
              "day.cats.find(c => (c.origin||'').trim() === prevOrigin)",
              "origin:prevOrigin || pc.id || cid",
              "cat = {id:cid, origin:cid, name:(name||'').trim()",
          ]
          for marker in assertions:
              if marker not in s:
                  raise SystemExit(f"ASSERTION FAILED: {marker}")

          p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path

          html = Path('diary.html').read_text(encoding='utf-8')
          scripts = re.findall(r'(?is)<script(?![^>]*\bsrc\s*=)[^>]*>(.*?)</script>', html)
          checked = 0
          for js in scripts:
              if not js.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as f:
                  f.write(js)
                  name = f.name
              subprocess.run(['node', '--check', name], check=True)
              Path(name).unlink(missing_ok=True)
              checked += 1
          if checked == 0:
              raise SystemExit('No inline JavaScript checked')
          print(f'JavaScript syntax PASS: {checked} inline script(s)')
          PY
          git diff --check

      - name: Commit verified diary.html
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-diary-deploy'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diary.html
          git diff --cached --quiet && { echo 'No diary.html changes to commit'; exit 1; }
          git commit -m 'feat: add category lineage identity'
          git push origin HEAD:main
