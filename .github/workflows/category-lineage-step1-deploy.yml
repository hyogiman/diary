name: Category lineage Step 1 deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/category-lineage-step1-deploy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify expected Diary base
        run: |
          ACTUAL=$(git hash-object diary.html)
          EXPECTED=cb484bbeb29d8da3d9679424a53e2caa01974a49
          echo "diary.html blob: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Apply category lineage patch
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Validate JavaScript and patch
        run: |
          node --check /tmp/diary-inline.js
          git diff --check
          git diff -- diary.html
      - name: Commit Diary update
        run: |
          git config user.name "ChatGPT Diary Updater"
          git config user.email "actions@users.noreply.github.com"
          git add diary.html
          git commit -m "Add Diary category lineage identity"
          git push origin HEAD:main
