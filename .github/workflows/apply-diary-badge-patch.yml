name: Apply Diary badge patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-diary-badge-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Diary badge labels
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('diary.html')
          text = path.read_text(encoding='utf-8')

          new_date_func = '''function taskDateBadge(t, ctx={}){
            const explicit = (t.due || '').trim();
            let date = explicit;
            let implicit = false;
            if(!date){
              if(ctx.inbox){
                date = (t.timeDay || '').trim();
              }else{
                date = curDate;
              }
              implicit = !!date;
            }
            if(!date) return {date:'', label:'📅', implicit:true};
            const label = date === todayStr()
              ? '오늘'
              : (() => {
                  const d = new Date(date + 'T12:00:00');
                  return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;
                })();
            return {date, label, implicit};
          }'''

          new_deadline_func = '''function taskDeadlineBadge(t){
            const date = (t.deadline || '').trim();
            if(!date) return {date:'', label:'', over:false};
            const label = date === todayStr()
              ? '오늘'
              : (() => {
                  const d = new Date(date + 'T12:00:00');
                  return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;
                })();
            return {date, label:`🚩 ${label}까지`, over:!t.done && date < todayStr()};
          }'''

          text, n1 = re.subn(
              r'function taskDateBadge\(t, ctx=\{\}\)\{.*?^\}',
              new_date_func,
              text,
              count=1,
              flags=re.S | re.M,
          )
          if n1 != 1:
              raise SystemExit(f'expected one taskDateBadge function, replaced {n1}')

          text, n2 = re.subn(
              r'function taskDeadlineBadge\(t\)\{.*?^\}',
              new_deadline_func,
              text,
              count=1,
              flags=re.S | re.M,
          )
          if n2 != 1:
              raise SystemExit(f'expected one taskDeadlineBadge function, replaced {n2}')

          path.write_text(text, encoding='utf-8')

          scripts = []
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>', text, re.S | re.I):
              if re.search(r'\bsrc\s*=', m.group(1), re.I):
                  continue
              if m.group(2).strip():
                  scripts.append(m.group(2))
          Path('/tmp/diary-inline.js').write_text('\n;\n'.join(scripts), encoding='utf-8')

      - name: Validate JavaScript
        run: node --check /tmp/diary-inline.js

      - name: Commit Diary update
        run: |
          git config user.name "ChatGPT Diary Updater"
          git config user.email "actions@users.noreply.github.com"
          git add diary.html
          git diff --cached --check
          git commit -m "Update Diary schedule and deadline badge dates"
          git push origin HEAD:main
