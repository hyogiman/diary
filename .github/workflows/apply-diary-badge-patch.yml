name: Apply Diary badge patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-diary-badge-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Diary badge labels
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('diary.html')
          text = path.read_text(encoding='utf-8')

          old_date = """  if(!date) return {date:'', label:'📅', implicit:true};
          const label = date === todayStr()
            ? '오늘'
            : `${+date.slice(5,7)}/${+date.slice(8,10)}`;
          return {date, label, implicit};
          """
          new_date = """  if(!date) return {date:'', label:'📅', implicit:true};
          const label = date === todayStr()
            ? '오늘'
            : (() => {
                const d = new Date(date + 'T12:00:00');
                return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;
              })();
          return {date, label, implicit};
          """

          old_deadline = """  const label = date === todayStr() ? '오늘' : `${+date.slice(5,7)}/${+date.slice(8,10)}`;
          return {date, label:`🚩 기한 ${label}`, over:!t.done && date < todayStr()};
          """
          new_deadline = """  const label = date === todayStr()
            ? '오늘'
            : (() => {
                const d = new Date(date + 'T12:00:00');
                return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;
              })();
          return {date, label:`🚩 ${label}까지`, over:!t.done && date < todayStr()};
          """

          if text.count(old_date) != 1:
              raise SystemExit(f'expected one execution-date badge block, found {text.count(old_date)}')
          text = text.replace(old_date, new_date)

          if text.count(old_deadline) != 1:
              raise SystemExit(f'expected one deadline badge block, found {text.count(old_deadline)}')
          text = text.replace(old_deadline, new_deadline)

          path.write_text(text, encoding='utf-8')

          # Basic inline-JS syntax validation.
          scripts = []
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>', text, re.S | re.I):
              if re.search(r'\\bsrc\\s*=', m.group(1), re.I):
                  continue
              if m.group(2).strip():
                  scripts.append(m.group(2))
          Path('/tmp/diary-inline.js').write_text('\n;\n'.join(scripts), encoding='utf-8')

      - name: Validate JavaScript
        run: node --check /tmp/diary-inline.js

      - name: Commit Diary update
        run: |
          git config user.name "ChatGPT Diary Updater"
          git config user.email "actions@users.noreply.github.com"
          git add diary.html
          git diff --cached --check
          git commit -m "Update Diary schedule and deadline badge dates"
          git push origin HEAD:main
